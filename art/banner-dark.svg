<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel UUID</title>
    <desc id="description">Version 1, 3, 4, and 5 UUIDs for Laravel and plain PHP.</desc>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0c0a09"/>
            <stop offset="1" stop-color="#1c1917"/>
        </linearGradient>
    </defs>
    <rect width="800" height="200" rx="16" fill="url(#background)"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="40" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Laravel UUID</text>
        <text x="42" y="110" fill="#a8a29e" font-size="14">Generate, import, compare, and validate UUIDs.</text>
        <g transform="translate(42 132)" font-size="10" font-weight="500" text-anchor="middle">
            <rect x="0" width="124" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity=".8"/><text x="62" y="15" fill="#a78bfa">UUID v1 / v3 / v4 / v5</text><rect x="134" width="96" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity=".8"/><text x="182" y="15" fill="#60a5fa">Laravel + PHP</text><rect x="240" width="118" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity=".8"/><text x="299" y="15" fill="#4ade80">Zero dependencies</text>
        </g>
    </g>
    <g transform="translate(570 38)">
        <rect width="186" height="124" rx="12" fill="#1c1917" stroke="#44403c"/>
