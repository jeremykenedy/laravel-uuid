            <rect x="50" y="20" width="16" height="7" rx="3" opacity=".6"/>
            <rect x="72" y="20" width="16" height="7" rx="3" opacity=".4"/>
        </g>
        <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
            <text x="18" y="54" fill="#fff">f81d4fae-7dec</text>
            <text x="18" y="74" fill="#8b5cf6">11d0-a765</text>
            <text x="18" y="94" fill="#a8a29e">00a0c91e6bf6</text>
        </g>
        <circle cx="157" cy="89" r="13" fill="#14532d"/>
