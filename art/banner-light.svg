<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
    <title id="title">Laravel UUID</title>
    <desc id="description">Version 1, 3, 4, and 5 UUIDs for Laravel and plain PHP.</desc>
    <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="40" y="80" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-.5">Laravel UUID</text>
        <text x="42" y="110" fill="#64748b" font-size="14">Generate, import, compare, and validate UUIDs.</text>
        <g transform="translate(42 132)" font-size="10" font-weight="500" text-anchor="middle">
            <rect x="0" width="124" height="22" rx="11" fill="#f5f3ff" stroke="#a78bfa" stroke-width=".8"/><text x="62" y="15" fill="#6d28d9">UUID v1 / v3 / v4 / v5</text><rect x="134" width="96" height="22" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width=".8"/><text x="182" y="15" fill="#1e40af">Laravel + PHP</text><rect x="240" width="118" height="22" rx="11" fill="#f0fdf4" stroke="#4ade80" stroke-width=".8"/><text x="299" y="15" fill="#166534">Zero dependencies</text>
        </g>
    </g>
    <g transform="translate(570 38)">
        <rect width="186" height="124" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
        <g fill="#8b5cf6">
            <rect x="18" y="20" width="26" height="7" rx="3"/>
            <rect x="50" y="20" width="16" height="7" rx="3" opacity=".6"/>
            <rect x="72" y="20" width="16" height="7" rx="3" opacity=".4"/>
        </g>
        <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
            <text x="18" y="54" fill="#0f172a">f81d4fae-7dec</text>
            <text x="18" y="74" fill="#8b5cf6">11d0-a765</text>
            <text x="18" y="94" fill="#64748b">00a0c91e6bf6</text>
        </g>
        <circle cx="157" cy="89" r="13" fill="#dcfce7"/>
        <path d="M151 89l4 4 8-9" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
